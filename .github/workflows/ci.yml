name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: unit tests
        env: { PYTHONPATH: src }
        run: python3 -m unittest discover -s tests -v
      - name: golden set
        env: { PYTHONPATH: src }
        run: python3 -m foundry eval
      - name: demo (mock, deterministic)
        env: { PYTHONPATH: src }
        run: python3 -m foundry run --case evals/cases/01-refund.json --mock
      - name: no secrets in tree
        run: |
          ! grep -rInE '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH) PRIVATE KEY)' \
            --exclude-dir=.git . || (echo "secret-like string found" && exit 1)
